<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VOICES — BlackMamba</title>
<style>
:root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; background:#080a0f; color:#eef3ff; }
main { width:min(1180px,92vw); margin:auto; padding:42px 0 80px; }
header { display:flex; justify-content:space-between; gap:24px; align-items:center; }
.brand { letter-spacing:.16em; font-size:13px; opacity:.72; }
button { border:1px solid #343a48; background:#121722; color:white; border-radius:999px; padding:12px 18px; cursor:pointer; }
.meter { margin:70px 0 28px; display:flex; align-items:center; gap:20px; }
.orb { width:82px; height:82px; border-radius:50%; background:#555; box-shadow:0 0 42px #555; transition:.08s linear; }
.readout { font-variant-numeric:tabular-nums; opacity:.8; }
.transcript { min-height:240px; font-size:clamp(32px,6vw,78px); line-height:1.24; padding-top:28px; border-top:1px solid #202632; }
.word { display:inline-block; margin-right:.22em; }
.status { opacity:.55; font-size:13px; }
</style>
</head>
<body>
<main>
<header>
  <div>
    <div class="brand">BLACKMAMBA / VOICES</div>
    <div class="status" id="status">desconectado</div>
  </div>
  <button id="start">Iniciar micrófono</button>
</header>
<div class="meter">
  <div class="orb" id="orb"></div>
  <div class="readout" id="readout">— Hz · —</div>
</div>
<div class="transcript" id="transcript"></div>
</main>
<script>
const startButton = document.getElementById('start');
const statusEl = document.getElementById('status');
const orb = document.getElementById('orb');
const readout = document.getElementById('readout');
const transcript = document.getElementById('transcript');
let socket, ctx, source, processor;

function downsample(input, inputRate, outputRate=16000) {
  if (inputRate === outputRate) return input;
  const ratio = inputRate / outputRate;
  const length = Math.floor(input.length / ratio);
  const result = new Float32Array(length);
  for (let i=0; i<length; i++) {
    const a = Math.floor(i * ratio);
    const b = Math.min(input.length, Math.floor((i+1)*ratio));
    let sum = 0;
    for (let j=a; j<b; j++) sum += input[j];
    result[i] = sum / Math.max(1, b-a);
  }
  return result;
}

function floatToPCM16(float32) {
  const out = new Int16Array(float32.length);
  for (let i=0; i<float32.length; i++) {
    out[i] = Math.max(-1, Math.min(1, float32[i])) * 32767;
  }
  return out.buffer;
}

function renderWords(words) {
  for (const word of words) {
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = word.text;
    span.style.color = word.color;
    span.style.opacity = word.opacity;
    span.style.fontWeight = word.font_weight;
    span.style.textShadow = '0 0 ' + word.glow_px + 'px ' + word.color;
    const cents = word.cents == null ? '' : word.cents.toFixed(1) + ' cents';
    span.title = (word.note || '') + ' ' + cents;
    transcript.appendChild(span);
    transcript.appendChild(document.createTextNode(' '));
  }
}

startButton.onclick = async () => {
  if (socket && socket.readyState === WebSocket.OPEN) return;
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  socket = new WebSocket(protocol + '://' + location.host + '/ws');
  socket.binaryType = 'arraybuffer';
  socket.onopen = async () => {
    statusEl.textContent = 'escuchando';
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    ctx = new AudioContext();
    source = ctx.createMediaStreamSource(stream);
    processor = ctx.createScriptProcessor(4096, 1, 1);
    processor.onaudioprocess = e => {
      if (socket.readyState !== WebSocket.OPEN) return;
      const mono = e.inputBuffer.getChannelData(0);
      socket.send(floatToPCM16(downsample(mono, ctx.sampleRate)));
    };
    source.connect(processor);
    processor.connect(ctx.destination);
    startButton.textContent = 'Micrófono activo';
  };
  socket.onmessage = event => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'meter') {
      orb.style.background = msg.color;
      orb.style.boxShadow = '0 0 42px ' + msg.color;
      const hz = msg.f0_hz ? msg.f0_hz.toFixed(1) : '—';
      readout.textContent = hz + ' Hz · ' + (msg.note || '—');
    } else if (msg.type === 'transcript') {
      renderWords(msg.words);
    } else if (msg.type === 'state') {
      statusEl.textContent = msg.value;
    } else if (msg.type === 'error') {
      statusEl.textContent = msg.message;
    }
  };
  socket.onclose = () => { statusEl.textContent = 'desconectado'; };
};
</script>
</body>
</html>
