[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackmamba-voices"
version = "0.1.0"
description = "Acoustic voice-to-color transcript engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
whisper = ["faster-whisper>=1.0.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = ["sounddevice>=0.4.6", "faster-whisper>=1.0.0", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
voices = "voices.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
